name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run check:install
      - run: npm run preview:build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-assets
          path: dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
