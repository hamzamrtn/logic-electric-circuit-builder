name: Build and attest release assets
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release tag matches the manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const m = require("./manifest.json"); if (m.version !== process.env.RELEASE_TAG) throw new Error("Release tag must exactly match manifest.version");'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run check:install
      - run: npm run preview:build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run package
      - name: Attest the exact release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/logic-electric-circuit-builder/main.js
            dist/logic-electric-circuit-builder/manifest.json
            dist/logic-electric-circuit-builder/styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Attach the built and attested files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/logic-electric-circuit-builder/main.js \
            dist/logic-electric-circuit-builder/manifest.json \
            dist/logic-electric-circuit-builder/styles.css \
            --clobber
